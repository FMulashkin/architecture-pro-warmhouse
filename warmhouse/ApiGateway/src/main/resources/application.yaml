server:
  port: 8082

spring:
  cloud:
    gateway:
      routes:
        # Маршрут к temperature-api
        - id: temperature-api
          uri: http://temperature-api:8082
          predicates:
            - Path=/api/temperature/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/analytics/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/device/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/notification/**
          filters:
            - StripPrefix=1

        - id: user-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

# Актуатор (опционально)
management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: gateway